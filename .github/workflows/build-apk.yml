name: Compilar APK (Wall4K)

# Se ejecuta al hacer push a estas ramas, en pull requests, a mano,
# y al crear un tag v* (que además publica un Release con el APK).
on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
    paths:
      - "Wall4K/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "Wall4K/**"
  workflow_dispatch: {}

# Directorio del proyecto Android (está en una subcarpeta del repo).
defaults:
  run:
    working-directory: Wall4K

permissions:
  contents: write   # necesario para publicar el Release al hacer un tag

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wall4K-debug.apk

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wall4K-debug-apk
          path: Wall4K/Wall4K-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Wall4K/Wall4K-debug.apk
          generate_release_notes: true
